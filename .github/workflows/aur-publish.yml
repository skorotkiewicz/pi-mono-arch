name: Check Version and Publish to AUR

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  check-and-publish:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel

    steps:
      - name: Install dependencies and create builder user
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm git openssh jq curl just pacman-contrib sudo
          # Create builder user for makepkg (cannot run as root)
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set ownership for builder user
        run: |
          chown -R builder:builder $GITHUB_WORKSPACE

      - name: Configure Git for builder user
        run: |
          sudo -u builder git config --global user.name "github-actions[bot]"
          sudo -u builder git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup SSH for AUR
        run: |
          # Setup SSH in builder's home directory
          mkdir -p /home/builder/.ssh
          echo "${{ secrets.AUR_SSH_PRIVATE_KEY }}" > /home/builder/.ssh/aur_key
          chmod 600 /home/builder/.ssh/aur_key
          chown -R builder:builder /home/builder/.ssh
          cat << 'EOF' > /home/builder/.ssh/config
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur_key
            User aur
            StrictHostKeyChecking accept-new
          EOF
          chmod 600 /home/builder/.ssh/config
          chown builder:builder /home/builder/.ssh/config

      - name: Get current and latest versions
        id: versions
        run: |
          current_ver=$(grep -oP '^pkgver=\K.*' PKGBUILD)
          latest_ver=$(curl -s https://api.github.com/repos/badlogic/pi-mono/releases/latest | jq -r '.tag_name' | sed 's/^v//')
          echo "current=$current_ver" >> $GITHUB_OUTPUT
          echo "latest=$latest_ver" >> $GITHUB_OUTPUT
          echo "Current version: $current_ver"
          echo "Latest version: $latest_ver"

      - name: Update PKGBUILD and checksums
        if: steps.versions.outputs.current != steps.versions.outputs.latest
        run: |
          latest_ver="${{ steps.versions.outputs.latest }}"
          echo "Updating to $latest_ver..."
          sed -i "s/^pkgver=.*/pkgver=$latest_ver/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          # Run updpkgsums and makepkg as builder user in the workspace
          sudo -u builder -E HOME=/home/builder bash -c 'updpkgsums && makepkg --printsrcinfo > .SRCINFO'
          echo "PKGBUILD and .SRCINFO updated to version $latest_ver."

      - name: Build package
        if: steps.versions.outputs.current != steps.versions.outputs.latest
        run: |
          sudo -u builder -E HOME=/home/builder makepkg -f

      - name: Push to AUR
        if: steps.versions.outputs.current != steps.versions.outputs.latest
        run: |
          # Run all git commands as builder with proper HOME for SSH config
          if ! sudo -u builder -E HOME=/home/builder git remote | grep -q "^aur$"; then
            sudo -u builder -E HOME=/home/builder git remote add aur ssh://aur@aur.archlinux.org/pi-bin.git
          fi
          sudo -u builder -E HOME=/home/builder git checkout -b aur-deploy || sudo -u builder -E HOME=/home/builder git checkout aur-deploy
          sudo -u builder -E HOME=/home/builder git add PKGBUILD .SRCINFO
          sudo -u builder -E HOME=/home/builder git commit -m "aur: ${{ steps.versions.outputs.latest }}" || echo "No changes to commit"
          sudo -u builder -E HOME=/home/builder git push aur aur-deploy:master --force

      - name: Push to GitHub
        if: steps.versions.outputs.current != steps.versions.outputs.latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo -u builder -E HOME=/home/builder git checkout master || sudo -u builder -E HOME=/home/builder git checkout -b master
          sudo -u builder -E HOME=/home/builder git add PKGBUILD .SRCINFO
          sudo -u builder -E HOME=/home/builder git commit -m "update: ${{ steps.versions.outputs.latest }}" || echo "No changes to commit"
          sudo -u builder -E HOME=/home/builder git push https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git master

      - name: Summary
        run: |
          if [ "${{ steps.versions.outputs.current }}" = "${{ steps.versions.outputs.latest }}" ]; then
            echo "No new version available. Current: ${{ steps.versions.outputs.current }}"
          else
            echo "Published version ${{ steps.versions.outputs.latest }} to AUR"
          fi
